name: Upload Release Asset

on:
  release:
    types: [published]

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, zip
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - uses: pnpm/action-setup@v4

      - run: pnpm run build-plugin
      - run: pnpm run check:archive

      - name: Rename output file
        run: mv icepay-for-woocommerce.zip icepay-for-woocommerce-${{ github.ref_name }}.zip

      - name: Add to release
        uses: softprops/action-gh-release@v2
        with:
          files: icepay-for-woocommerce-${{ github.ref_name }}.zip
