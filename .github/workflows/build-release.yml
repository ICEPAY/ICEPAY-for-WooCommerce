name: Build release zip

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm run build-plugin

      - name: Unzip # GH currently always zips, so if we upload a zip we get a zip inside a zip
        run: unzip icepay-for-woocommerce.zip -d dist

      - name: move composer file
        run: cp composer.json dist/composer.json

      - name: Upload the ZIP file
        uses: actions/upload-artifact@v4
        with:
          name: icepay-for-woocommerce
          path: |
            dist/
            !dist/README.md
            !dist/DEVELOPMENT.md
            !dist/SECURITY.md
          retention-days: 5
