name: Build release zip

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, zip
          tools: composer, wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@v4

      - name: Generate MO files
        run: |
          for po_file in languages/*.po; do
            mo_file="${po_file%.po}.mo"
            wp i18n make-mo "$po_file" "$mo_file" --allow-root
          done

      - run: pnpm run build-plugin
      - run: pnpm run check:archive

      - name: Unzip # GH currently always zips, so if we upload a zip we get a zip inside a zip
        run: unzip icepay-for-woocommerce.zip -d dist

      - name: move composer file
        run: |
          cp composer.json dist/composer.json

      - name: Upload the ZIP file
        uses: actions/upload-artifact@v4
        with:
          name: icepay-for-woocommerce
          path: dist/
          retention-days: 5
