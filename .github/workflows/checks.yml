name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: pnpm/action-setup@v4
      - run: composer install --prefer-dist --no-interaction
      - run: composer check
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:js
      - run: pnpm run build
      - name: Start disposable WordPress
        run: |
          # Match the app's UID/GID before Docker creates nested mount directories.
          sudo install -d -m 755 -o 1000 -g 1000 wordpress wordpress/wp-content wordpress/wp-content/plugins wordpress/wp-content/themes
          docker compose up -d --build app db
          ready=false
          for i in $(seq 1 60); do
            if ! docker compose ps --status running --services | grep -qx app; then
              echo 'WordPress container exited during startup.' >&2
              exit 1
            fi
            if docker compose exec -T app wp core version &&
              docker compose exec -T app php -r 'mysqli_report(MYSQLI_REPORT_OFF); $db = new mysqli(getenv("WORDPRESS_DB_HOST"), getenv("WORDPRESS_DB_USER"), getenv("WORDPRESS_DB_PASSWORD"), getenv("WORDPRESS_DB_NAME")); exit($db->connect_errno ? 1 : 0);'; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo 'WordPress or its database did not become ready within 300 seconds.' >&2
            exit 1
          fi
          docker compose exec -T app wp core install --url=http://localhost --title=ICEPAY-CI --admin_user=admin --admin_password=ci-only-password --admin_email=ci@example.invalid --skip-email
          docker compose exec -T app wp plugin install woocommerce --activate
          docker compose exec -T app wp plugin activate icepay-for-woocommerce
          docker compose exec -T app wp option update woocommerce_custom_orders_table_enabled yes
      - run: composer test
      - name: Browser attribution checks
        env:
          CHROME_BIN: /usr/bin/google-chrome
          WORDPRESS_URL: http://localhost
        run: pnpm run test:attribution
      - name: Blocks restriction checks
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: pnpm run test:restrictions
      - name: Build and validate release artifact
        run: |
          composer install --no-dev --prefer-dist --no-interaction
          pnpm run archive
          pnpm run check:archive
      - name: Docker diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100 app db
      - if: always()
        run: docker compose down -v
